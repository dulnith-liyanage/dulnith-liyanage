name: GitHub Metrics

on:
  schedule:
    - cron: "47 19 * * *" # 01:17 Asia/Colombo
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: profile-main-writes
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'dulnith-liyanage/dulnith-liyanage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Metrics secret
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Add the METRICS_TOKEN repository secret, then rerun this workflow."
            exit 1
          fi

      - name: Render profile statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: dulnith-liyanage
          repo: dulnith-liyanage
          committer_branch: main
          filename: github-metrics.svg
          output_action: commit
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Colombo
          config_animations: "yes"
          plugin_languages: "yes"
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: "no"
          plugin_habits: "yes"
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: "yes"
          plugin_habits_charts: "yes"
