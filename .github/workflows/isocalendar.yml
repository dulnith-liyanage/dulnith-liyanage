name: Half-Year Isometric Calendar & Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/isocalendar.yml
      - .github/scripts/clean-isocalendar.py

permissions:
  contents: write

concurrency:
  group: profile-main-writes
  cancel-in-progress: false

jobs:
  isocalendar:
    if: github.repository == 'dulnith-liyanage/dulnith-liyanage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render Half-Year Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: dulnith-liyanage
          filename: isocalendar.raw.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Clean & Enlarge Isometric Calendar
        run: |
          python3 .github/scripts/clean-isocalendar.py /metrics_renders/isocalendar.raw.svg isocalendar.svg

      - name: Render Languages Card
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: dulnith-liyanage
          filename: languages.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          config_timezone: Asia/Colombo

      - name: Copy and format rendered cards
        run: |
          if [ -f "/metrics_renders/languages.svg" ]; then
            cp "/metrics_renders/languages.svg" "./languages.svg"
          elif [ -f "metrics_renders/languages.svg" ]; then
            cp "metrics_renders/languages.svg" "./languages.svg"
          fi
          if [ -f "./languages.svg" ]; then
            python3 -c "import re; s=open('languages.svg').read(); open('languages.svg','w').write(re.sub(r'<svg xmlns=\"http://www.w3.org/2000/svg\"\s+width=\"(\d+)\"\s+height=\"(\d+)\"', r'<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 \1 \2\" width=\"100%\" height=\"auto\"', s, count=1))"
          fi

      - name: Commit and push clean calendar and languages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add isocalendar.svg languages.svg
          if git diff --staged --quiet; then
            echo "No changes in metrics files"
          else
            git commit -m "chore: update isometric calendar and languages - [Skip GitHub Action]"
            git push
          fi
