<svg xmlns="http://www.w3.org/2000/svg" width="440" height="264" viewBox="0 0 440 264">
    <style>
        svg {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: #57606a;
        }
        @media (prefers-color-scheme: dark) {
            svg { color: #8b949e; }
            .card-title { color: #58a6ff !important; }
            .section-title { color: #79c0ff !important; }
            .field-text { color: #c9d1d9 !important; }
            .field-sub { color: #8b949e !important; }
            .metric-box { background: rgba(110, 118, 129, 0.1) !important; border-color: rgba(110, 118, 129, 0.2) !important; }
        }
        .card-title {
            margin: 6px 0 10px;
            font-size: 15px;
            font-weight: 600;
            color: #0969da;
            display: flex;
            align-items: center;
        }
        .section-title {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 600;
            color: #1f2328;
            display: flex;
            align-items: center;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .metric-box {
            flex: 1;
            background: rgba(234, 238, 242, 0.5);
            border: 1px solid rgba(27, 31, 35, 0.08);
            border-radius: 6px;
            padding: 10px 12px;
        }
        .field {
            display: flex;
            align-items: center;
            margin-bottom: 7px;
            font-size: 12.5px;
        }
        .field:last-child {
            margin-bottom: 0;
        }
        .field-icon {
            margin-right: 8px;
            flex-shrink: 0;
        }
        .field-text {
            color: #24292f;
            font-weight: 500;
        }
        .field-sub {
            color: #57606a;
            margin-left: auto;
            font-size: 11.5px;
        }
        .badge-pill {
            display: inline-block;
            background: #238636;
            color: #ffffff;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: auto;
        }
    </style>
