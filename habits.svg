<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
    <defs>
        <style>
            svg {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                font-size: 13px;
                color: #777;
            }
            h2 {
                margin: 4px 0 10px;
                padding: 0;
                color: #0366d6;
                font-weight: 600;
                font-size: 15px;
                display: flex;
                align-items: center;
            }
            h2 svg {
                fill: currentColor;
                margin-right: 6px;
            }
            .habits-container {
                display: flex;
                align-items: center;
                gap: 24px;
            }
            .chart-col {
                flex: 1.2;
            }
            .info-col {
                flex: 0.9;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .chart-bars {
                display: flex;
                align-items: flex-end;
                height: 70px;
                gap: 4px;
                padding-bottom: 4px;
                border-bottom: 1px solid #d0d7de;
            }
            .bar {
                flex: 1;
                border-radius: 2px 2px 0 0;
                background-color: #38bdf8;
                opacity: 0.85;
                transition: opacity 0.2s;
            }
            .bar:hover {
                opacity: 1;
            }
            .chart-labels {
                display: flex;
                justify-content: space-between;
                font-size: 10px;
                color: #6e7781;
                margin-top: 4px;
            }
            .stat-badge {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #586069;
            }
            .stat-badge b {
                color: #24292e;
            }
            @media (prefers-color-scheme: dark) {
                h2 { color: #58a6ff; }
                .chart-bars { border-color: #30363d; }
                .chart-labels { color: #8b949e; }
                .stat-badge { color: #8b949e; }
                .stat-badge b { color: #c9d1d9; }
                .bar { background-color: #38bdf8; }
            }
        </style>
    </defs>
    <foreignObject x="0" y="0" width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="padding: 12px 18px;">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
                    <path fill-rule="evenodd" d="M1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0zM8 0a8 8 0 100 16A8 8 0 008 0zm.5 4.75a.75.75 0 00-1.5 0v3.5a.75.75 0 00.37.65l2.5 1.5a.75.75 0 00.76-1.3L8.5 8.11V4.75z"/>
                </svg>
                Recent Coding Habits &amp; Activity Rhythm (Asia/Colombo)
            </h2>
            <div class="habits-container">
                <div class="chart-col">
                    <div class="chart-bars">
                        <!-- 24 hourly activity bars (00 to 23) -->
                        <div class="bar" style="height: 35%;" title="00:00 - Moderate"></div>
                        <div class="bar" style="height: 20%;" title="01:00"></div>
                        <div class="bar" style="height: 10%;" title="02:00"></div>
                        <div class="bar" style="height: 5%;" title="03:00"></div>
                        <div class="bar" style="height: 5%;" title="04:00"></div>
                        <div class="bar" style="height: 5%;" title="05:00"></div>
                        <div class="bar" style="height: 10%;" title="06:00"></div>
                        <div class="bar" style="height: 15%;" title="07:00"></div>
                        <div class="bar" style="height: 25%;" title="08:00"></div>
                        <div class="bar" style="height: 45%;" title="09:00"></div>
                        <div class="bar" style="height: 60%;" title="10:00"></div>
                        <div class="bar" style="height: 70%;" title="11:00"></div>
                        <div class="bar" style="height: 55%;" title="12:00"></div>
                        <div class="bar" style="height: 50%;" title="13:00"></div>
                        <div class="bar" style="height: 75%;" title="14:00 - High"></div>
                        <div class="bar" style="height: 85%;" title="15:00 - Peak"></div>
                        <div class="bar" style="height: 90%;" title="16:00 - Peak"></div>
                        <div class="bar" style="height: 80%;" title="17:00 - High"></div>
                        <div class="bar" style="height: 65%;" title="18:00"></div>
                        <div class="bar" style="height: 75%;" title="19:00 - High"></div>
                        <div class="bar" style="height: 95%;" title="20:00 - Peak"></div>
                        <div class="bar" style="height: 100%;" title="21:00 - Peak"></div>
                        <div class="bar" style="height: 80%;" title="22:00 - High"></div>
                        <div class="bar" style="height: 55%;" title="23:00"></div>
                    </div>
                    <div class="chart-labels">
                        <span>00:00</span>
                        <span>06:00</span>
                        <span>12:00</span>
                        <span>18:00</span>
                        <span>23:00</span>
                    </div>
                </div>
                <div class="info-col">
                    <div class="stat-badge">
                        <span>🕒 Peak Activity:</span>
                        <b>Afternoon &amp; Night (14:00 - 23:00)</b>
                    </div>
                    <div class="stat-badge">
                        <span>📅 Active Days:</span>
                        <b>Daily Engineering Consistency</b>
                    </div>
                    <div class="stat-badge">
                        <span>⚡ Workflow:</span>
                        <b>Microcontroller Firmware &amp; AI Algorithms</b>
                    </div>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>