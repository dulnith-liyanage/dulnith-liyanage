name: Half-Year Isometric Calendar

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/isocalendar.yml
      - .github/scripts/clean-isocalendar.py

permissions:
  contents: write

concurrency:
  group: profile-main-writes
  cancel-in-progress: false

jobs:
  isocalendar:
    if: github.repository == 'dulnith-liyanage/dulnith-liyanage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render Half-Year Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: dulnith-liyanage
          filename: isocalendar.raw.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Clean & Enlarge Isometric Calendar
        run: |
          python3 .github/scripts/clean-isocalendar.py /metrics_renders/isocalendar.raw.svg isocalendar.svg

      - name: Commit and push clean calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add isocalendar.svg
          if git diff --staged --quiet; then
            echo "No changes in isocalendar.svg"
          else
            git commit -m "chore: update clean isometric commit calendar - [Skip GitHub Action]"
            git push
          fi
