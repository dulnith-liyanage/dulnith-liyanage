<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="1000" height="219">
    <defs>
        <style>
            svg {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                font-size: 13px;
                color: #777;
            }
            h2 {
                margin: 2px 0 14px;
                padding: 0;
                color: #0366d6;
                font-weight: 600;
                font-size: 16px;
                display: flex;
                align-items: center;
            }
            h2 svg {
                fill: currentColor;
                margin-right: 8px;
            }
            .habits-container {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 36px;
            }
            .chart-col {
                flex: 1.5;
            }
            .info-col {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding-left: 20px;
                border-left: 1px solid #e1e4e8;
            }
            .chart-bars {
                display: flex;
                align-items: flex-end;
                height: 85px;
                gap: 6px;
                padding-bottom: 4px;
                border-bottom: 1px solid #d0d7de;
            }
            .bar {
                flex: 1;
                border-radius: 3px 3px 0 0;
                background-color: #38bdf8;
                opacity: 0.85;
                transition: opacity 0.2s, transform 0.2s;
            }
            .bar:hover {
                opacity: 1;
                background-color: #0284c7;
            }
            .chart-labels {
                display: flex;
                justify-content: space-between;
                font-size: 11px;
                color: #6e7781;
                margin-top: 6px;
            }
            .stat-badge {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 13px;
                color: #586069;
            }
            .stat-badge b {
                color: #24292e;
            }
            @media (prefers-color-scheme: dark) {
                h2 { color: #58a6ff; }
                .chart-bars { border-color: #30363d; }
                .chart-labels { color: #8b949e; }
                .info-col { border-left-color: #30363d; }
                .stat-badge { color: #8b949e; }
                .stat-badge b { color: #c9d1d9; }
                .bar { background-color: #38bdf8; }
                .bar:hover { background-color: #7dd3fc; }
            }
        </style>
    </defs>
    <foreignObject x="0" y="0" width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="padding: 14px 22px;">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="18" height="18">
                    <path fill-rule="evenodd" d="M1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0zM8 0a8 8 0 100 16A8 8 0 008 0zm.5 4.75a.75.75 0 00-1.5 0v3.5a.75.75 0 00.37.65l2.5 1.5a.75.75 0 00.76-1.3L8.5 8.11V4.75z"/>
                </svg>
                Recent Coding Habits &amp; Activity Rhythm (Asia/Colombo &#8226; UTC+5:30)
            </h2>
            <div class="habits-container">
                <div class="chart-col">
                    <div class="chart-bars">
                        <!-- 24 hourly activity bars (00 to 23) -->
                        <div class="bar" style="height: 35%;" title="00:00 - Moderate"></div>
                        <div class="bar" style="height: 20%;" title="01:00"></div>
                        <div class="bar" style="height: 10%;" title="02:00"></div>
                        <div class="bar" style="height: 5%;" title="03:00"></div>
                        <div class="bar" style="height: 5%;" title="04:00"></div>
                        <div class="bar" style="height: 5%;" title="05:00"></div>
                        <div class="bar" style="height: 10%;" title="06:00"></div>
                        <div class="bar" style="height: 15%;" title="07:00"></div>
                        <div class="bar" style="height: 28%;" title="08:00"></div>
                        <div class="bar" style="height: 48%;" title="09:00"></div>
                        <div class="bar" style="height: 62%;" title="10:00"></div>
                        <div class="bar" style="height: 72%;" title="11:00"></div>
                        <div class="bar" style="height: 58%;" title="12:00"></div>
                        <div class="bar" style="height: 52%;" title="13:00"></div>
                        <div class="bar" style="height: 78%;" title="14:00 - High"></div>
                        <div class="bar" style="height: 88%;" title="15:00 - Peak"></div>
                        <div class="bar" style="height: 92%;" title="16:00 - Peak"></div>
                        <div class="bar" style="height: 82%;" title="17:00 - High"></div>
                        <div class="bar" style="height: 68%;" title="18:00"></div>
                        <div class="bar" style="height: 78%;" title="19:00 - High"></div>
                        <div class="bar" style="height: 96%;" title="20:00 - Peak"></div>
                        <div class="bar" style="height: 100%;" title="21:00 - Peak"></div>
                        <div class="bar" style="height: 82%;" title="22:00 - High"></div>
                        <div class="bar" style="height: 58%;" title="23:00"></div>
                    </div>
                    <div class="chart-labels">
                        <span>00:00</span>
                        <span>04:00</span>
                        <span>08:00</span>
                        <span>12:00</span>
                        <span>16:00</span>
                        <span>20:00</span>
                        <span>23:00</span>
                    </div>
                </div>
                <div class="info-col">
                    <div class="stat-badge">
                        <span>🕒 <b>Peak Hours:</b></span>
                        <span>Afternoon &amp; Late Night (14:00 &#8211; 23:00)</span>
                    </div>
                    <div class="stat-badge">
                        <span>📅 <b>Productivity:</b></span>
                        <span>High Weekly &amp; Daily Consistency</span>
                    </div>
                    <div class="stat-badge">
                        <span>⚡ <b>Engineering Focus:</b></span>
                        <span>Embedded Firmware &amp; Computer Vision</span>
                    </div>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>